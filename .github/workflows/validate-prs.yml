name: Validate PRs

on:
  pull_request:
    branches:
      - main

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Setup env
        uses: ./.github/actions/setup_env

      # pull_request checkout uses the merge result, unlike review deployments
      # on branch pushes. Catch stale lockfile references before promotion.
      - name: Postgres unit tests (merge result)
        run: pnpm --filter postgres test:once

      - name: DangerJS
        run: pnpm danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
