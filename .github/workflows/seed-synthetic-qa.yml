name: Seed Synthetic QA Data

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Allowlisted synthetic scenario'
        required: true
        default: 'contract-unlock-resubmit-v1'
        type: choice
        options:
          - baseline-lite-v1
          - contract-linked-rate-v1
          - contract-unlock-add-rate-v1
          - contract-unlock-resubmit-v1
          - contract-submit-smoke-v1
      seed:
        description: 'Deterministic seed (letters, numbers, dot, underscore, hyphen)'
        required: true
        default: 'manual-qa-contract-smoke'
        type: string
      confirmation:
        description: 'Type SEED_QA to authorize one synthetic scenario'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-data-qa
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate QA scenario request
    runs-on: ubuntu-24.04
    steps:
      - name: Validate target, confirmation, and seed
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SYNTHETIC_DATA_SEED: ${{ inputs.seed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo 'QA synthetic data must run from the main branch' >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != 'SEED_QA' ]]; then
            echo 'QA synthetic data requires confirmation SEED_QA' >&2
            exit 1
          fi
          if [[ ! "${SYNTHETIC_DATA_SEED}" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo 'Seed must be 1-64 letters, numbers, dots, underscores, or hyphens' >&2
            exit 1
          fi

  seed-scenario:
    name: Seed and verify QA scenario
    needs: validate-request
    environment: qa
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup env
        uses: ./.github/actions/setup_env

      - name: Generate GraphQL clients
        run: pnpm --filter app-graphql generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Get QA AWS credentials
        uses: ./.github/actions/get_aws_credentials
        with:
          region: ${{ vars.AWS_DEFAULT_REGION }}
          account-id: ${{ secrets.QA_AWS_ACCOUNT_ID }}
          stage-name: qa
          use-cdk-role: 'true'

      - name: Resolve QA synthetic data resources
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME='app-api-qa-cdk'
          API_URL="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue | [0]" --output text)"
          BOOTSTRAP_FUNCTION="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SyntheticDataBootstrapFunctionName'].OutputValue | [0]" --output text)"
          STATE_CREDENTIALS_SECRET="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SyntheticDataStateCredentialsSecretName'].OutputValue | [0]" --output text)"
          CMS_CREDENTIALS_SECRET="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SyntheticDataCMSCredentialsSecretName'].OutputValue | [0]" --output text)"
          if [[ -z "${API_URL}" || "${API_URL}" == 'None' || -z "${BOOTSTRAP_FUNCTION}" || "${BOOTSTRAP_FUNCTION}" == 'None' || -z "${STATE_CREDENTIALS_SECRET}" || "${STATE_CREDENTIALS_SECRET}" == 'None' || -z "${CMS_CREDENTIALS_SECRET}" || "${CMS_CREDENTIALS_SECRET}" == 'None' ]]; then
            echo 'QA synthetic data resources are not deployed' >&2
            exit 1
          fi
          {
            echo "SYNTHETIC_DATA_API_URL=${API_URL}"
            echo "SYNTHETIC_DATA_BOOTSTRAP_FUNCTION=${BOOTSTRAP_FUNCTION}"
            echo "SYNTHETIC_DATA_STATE_CREDENTIALS_SECRET=${STATE_CREDENTIALS_SECRET}"
            echo "SYNTHETIC_DATA_CMS_CREDENTIALS_SECRET=${CMS_CREDENTIALS_SECRET}"
          } >> "${GITHUB_ENV}"

      - name: Bootstrap synthetic actors
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -nc '{stage: "qa", confirmation: "BOOTSTRAP_SYNTHETIC_DATA"}')"
          aws lambda invoke \
            --function-name "${SYNTHETIC_DATA_BOOTSTRAP_FUNCTION}" \
            --cli-binary-format raw-in-base64-out \
            --payload "${PAYLOAD}" \
            bootstrap-response.json
          jq -e '.success == true and .stage == "qa"' bootstrap-response.json

      - name: Load synthetic OAuth credentials
        shell: bash
        run: |
          set -euo pipefail
          STATE_SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "${SYNTHETIC_DATA_STATE_CREDENTIALS_SECRET}" --query SecretString --output text)"
          CMS_SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "${SYNTHETIC_DATA_CMS_CREDENTIALS_SECRET}" --query SecretString --output text)"
          STATE_CLIENT_ID="$(printf '%s' "${STATE_SECRET_JSON}" | jq -er '.clientId')"
          STATE_CLIENT_SECRET="$(printf '%s' "${STATE_SECRET_JSON}" | jq -er '.clientSecret')"
          CMS_CLIENT_ID="$(printf '%s' "${CMS_SECRET_JSON}" | jq -er '.clientId')"
          CMS_CLIENT_SECRET="$(printf '%s' "${CMS_SECRET_JSON}" | jq -er '.clientSecret')"
          echo "::add-mask::${STATE_CLIENT_ID}"
          echo "::add-mask::${STATE_CLIENT_SECRET}"
          echo "::add-mask::${CMS_CLIENT_ID}"
          echo "::add-mask::${CMS_CLIENT_SECRET}"
          {
            echo "SYNTHETIC_DATA_STATE_OAUTH_CLIENT_ID=${STATE_CLIENT_ID}"
            echo "SYNTHETIC_DATA_STATE_OAUTH_CLIENT_SECRET=${STATE_CLIENT_SECRET}"
            echo "SYNTHETIC_DATA_CMS_OAUTH_CLIENT_ID=${CMS_CLIENT_ID}"
            echo "SYNTHETIC_DATA_CMS_OAUTH_CLIENT_SECRET=${CMS_CLIENT_SECRET}"
          } >> "${GITHUB_ENV}"

      - name: Verify QA synthetic actors
        env:
          SYNTHETIC_DATA_ENABLED: 'true'
          SYNTHETIC_DATA_STAGE: qa
          SYNTHETIC_DATA_MAX_ATTEMPTS: '4'
          SYNTHETIC_DATA_RETRY_BASE_DELAY_MS: '250'
        run: pnpm --filter @mc-review/synthetic-data preflight

      - name: Seed and verify synthetic scenario
        env:
          SYNTHETIC_DATA_ENABLED: 'true'
          SYNTHETIC_DATA_STAGE: qa
          SYNTHETIC_DATA_MAX_ATTEMPTS: '4'
          SYNTHETIC_DATA_RETRY_BASE_DELAY_MS: '250'
          SYNTHETIC_DATA_SEED: ${{ inputs.seed }}
          SYNTHETIC_DATA_SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          case "${SYNTHETIC_DATA_SCENARIO}" in
            baseline-lite-v1)
              COMMAND='seed-baseline-lite'
              EVENT='synthetic.baseline-lite.completed'
              ;;
            contract-submit-smoke-v1)
              COMMAND='seed-contract-smoke'
              EVENT='synthetic.contract-smoke.completed'
              ;;
            contract-linked-rate-v1)
              COMMAND='seed-contract-linked-rate'
              EVENT='synthetic.contract-linked-rate.completed'
              ;;
            contract-unlock-add-rate-v1)
              COMMAND='seed-contract-unlock-add-rate'
              EVENT='synthetic.contract-unlock-add-rate.completed'
              ;;
            contract-unlock-resubmit-v1)
              COMMAND='seed-contract-unlock-resubmit'
              EVENT='synthetic.contract-unlock-resubmit.completed'
              ;;
            *)
              echo "Unsupported synthetic scenario ${SYNTHETIC_DATA_SCENARIO}" >&2
              exit 1
              ;;
          esac
          pnpm --filter @mc-review/synthetic-data cli "${COMMAND}" \
            --seed "${SYNTHETIC_DATA_SEED}" | tee synthetic-scenario.log
          RESULT="$(jq -Rsc --arg event "${EVENT}" '[split("\n")[] | fromjson? | select(.event == $event)] | last' synthetic-scenario.log)"
          jq -e --arg scenario "${SYNTHETIC_DATA_SCENARIO}" '. != null and .scenarioKey == $scenario' <<< "${RESULT}" > /dev/null
          {
            echo '## Synthetic QA scenario'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            printf '| Scenario | %s |\n' "${SYNTHETIC_DATA_SCENARIO}"
            printf '| Seed | %s |\n' "${SYNTHETIC_DATA_SEED}"
            if jq -e '.contractId' <<< "${RESULT}" > /dev/null; then
              printf '| Contract ID | %s |\n' "$(jq -r '.contractId' <<< "${RESULT}")"
            fi
            if jq -e '.sourceContractId' <<< "${RESULT}" > /dev/null; then
              printf '| Source contract ID | %s |\n' "$(jq -r '.sourceContractId' <<< "${RESULT}")"
            fi
            if jq -e '.rateId' <<< "${RESULT}" > /dev/null; then
              printf '| Rate ID | %s |\n' "$(jq -r '.rateId' <<< "${RESULT}")"
            fi
            if jq -e '.contractCount' <<< "${RESULT}" > /dev/null; then
              printf '| Contracts created | %s |\n' "$(jq -r '.contractCount' <<< "${RESULT}")"
              printf '| Unique rates created | %s |\n' "$(jq -r '.rateCount' <<< "${RESULT}")"
              printf '| Manifest | %s |\n' "$(jq -r '.manifestPath' <<< "${RESULT}")"
            fi
            if jq -e '.status' <<< "${RESULT}" > /dev/null; then
              printf '| Status | %s |\n' "$(jq -r '.status' <<< "${RESULT}")"
            fi
            if jq -e '.resubmittedMarker // .marker' <<< "${RESULT}" > /dev/null; then
              printf '| Marker | %s |\n' "$(jq -r '.resubmittedMarker // .marker' <<< "${RESULT}")"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload synthetic baseline manifest
        if: ${{ always() && inputs.scenario == 'baseline-lite-v1' }}
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-baseline-qa-${{ inputs.seed }}
          path: services/synthetic-data/synthetic-baseline-manifest.json
          if-no-files-found: warn
          retention-days: 30
