name: Seed Synthetic Review Data

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Deterministic seed (letters, numbers, dot, underscore, hyphen)'
        required: true
        default: 'manual-contract-smoke'
        type: string
      confirmation:
        description: 'Type SEED_REVIEW to authorize one synthetic contract'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: synthetic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-review:
    if: >-
      github.event.inputs.confirmation == 'SEED_REVIEW' &&
      !contains(fromJson('["develop", "main", "master", "impl", "val", "qa", "prod", "production"]'), github.ref_name)
    environment: dev
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set review stage name
        id: stage-name
        shell: bash
        run: |
          set -euo pipefail
          STAGE_NAME="$(./scripts/stage_name_for_branch.sh "${GITHUB_REF_NAME}")"
          case "${STAGE_NAME}" in
            local|main|dev|val|qa|prod)
              echo "Refusing to seed official stage ${STAGE_NAME}" >&2
              exit 1
              ;;
          esac
          echo "stage-name=${STAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "STAGE_NAME=${STAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Setup env
        uses: ./.github/actions/setup_env

      - name: Generate GraphQL clients
        run: pnpm --filter app-graphql generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Get AWS credentials
        uses: ./.github/actions/get_aws_credentials
        with:
          region: ${{ vars.AWS_DEFAULT_REGION }}
          account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
          stage-name: ${{ steps.stage-name.outputs.stage-name }}
          use-cdk-role: 'true'

      - name: Resolve review resources
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="app-api-${STAGE_NAME}-cdk"
          API_URL="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue | [0]" --output text)"
          BOOTSTRAP_FUNCTION="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SyntheticDataBootstrapFunctionName'].OutputValue | [0]" --output text)"
          CREDENTIALS_SECRET="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SyntheticDataCredentialsSecretName'].OutputValue | [0]" --output text)"
          if [[ -z "${API_URL}" || "${API_URL}" == "None" || -z "${BOOTSTRAP_FUNCTION}" || "${BOOTSTRAP_FUNCTION}" == "None" || -z "${CREDENTIALS_SECRET}" || "${CREDENTIALS_SECRET}" == "None" ]]; then
            echo "Review synthetic data resources are not deployed for ${STAGE_NAME}" >&2
            exit 1
          fi
          {
            echo "SYNTHETIC_DATA_API_URL=${API_URL}"
            echo "SYNTHETIC_DATA_BOOTSTRAP_FUNCTION=${BOOTSTRAP_FUNCTION}"
            echo "SYNTHETIC_DATA_CREDENTIALS_SECRET=${CREDENTIALS_SECRET}"
          } >> "${GITHUB_ENV}"

      - name: Bootstrap synthetic state actor
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -nc --arg stage "${STAGE_NAME}" '{stage: $stage, confirmation: "BOOTSTRAP_SYNTHETIC_DATA"}')"
          aws lambda invoke \
            --function-name "${SYNTHETIC_DATA_BOOTSTRAP_FUNCTION}" \
            --cli-binary-format raw-in-base64-out \
            --payload "${PAYLOAD}" \
            bootstrap-response.json
          jq -e --arg stage "${STAGE_NAME}" '.success == true and .stage == $stage' bootstrap-response.json

      - name: Load synthetic OAuth credentials
        shell: bash
        run: |
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "${SYNTHETIC_DATA_CREDENTIALS_SECRET}" --query SecretString --output text)"
          CLIENT_ID="$(printf '%s' "${SECRET_JSON}" | jq -er '.clientId')"
          CLIENT_SECRET="$(printf '%s' "${SECRET_JSON}" | jq -er '.clientSecret')"
          echo "::add-mask::${CLIENT_ID}"
          echo "::add-mask::${CLIENT_SECRET}"
          echo "SYNTHETIC_DATA_OAUTH_CLIENT_ID=${CLIENT_ID}" >> "${GITHUB_ENV}"
          echo "SYNTHETIC_DATA_OAUTH_CLIENT_SECRET=${CLIENT_SECRET}" >> "${GITHUB_ENV}"

      - name: Seed and verify one synthetic contract
        env:
          SYNTHETIC_DATA_ENABLED: 'true'
          SYNTHETIC_DATA_STAGE: ${{ steps.stage-name.outputs.stage-name }}
          SYNTHETIC_DATA_MAX_ATTEMPTS: '4'
          SYNTHETIC_DATA_RETRY_BASE_DELAY_MS: '250'
          SYNTHETIC_DATA_SEED: ${{ inputs.seed }}
        run: >-
          pnpm --filter @mc-review/synthetic-data cli seed-contract-smoke
          --seed "${SYNTHETIC_DATA_SEED}"
