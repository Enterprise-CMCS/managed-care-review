mutation SyntheticUnlockContract($input: UnlockContractInput!) {
    unlockContract(input: $input) {
        contract {
            id
            status
            draftRevision {
                updatedAt
                unlockInfo {
                    updatedReason
                    updatedBy {
                        role
                        email
                    }
                }
            }
        }
    }
}
