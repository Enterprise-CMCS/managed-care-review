query fetchContractWithQuestions($input: FetchContractInput!) {
    fetchContract(input: $input) {
        contract {
            ...contractFieldsFragment

            draftRevision {
                ...contractRevisionFragment
            }

            draftRates {
                ...rateFieldsFragment

                draftRevision {
                    ...rateRevisionFragment
                }

                revisions {
                    ...rateRevisionFragment
                }
            }

            withdrawnRates {
                ...rateFieldsFragment,
                revisions {
                    ...rateRevisionFragment
                }
                packageSubmissions {
                    ...ratePackageSubmissionsFragment
                }
            }

            packageSubmissions {
                ...packageSubmissionsFragment
            }

            undoUnlockPackages {
                ...undoUnlockPackagesFragment
            }

            questions {
                DMCOQuestions {
                    ...contractQuestionListFragment
                }
                DMCPQuestions {
                    ...contractQuestionListFragment
                }
                OACTQuestions {
                    ...contractQuestionListFragment
                }
            }
        }
    }
}
