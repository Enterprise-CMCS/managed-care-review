query indexIlosSubmissionsStripped($input: IndexContractsStrippedInput) {
    indexIlosSubmissionsStripped(input: $input) {
        totalCount
        edges {
            node {
                id
                createdAt
                updatedAt
                status
                reviewStatus
                consolidatedStatus
                initiallySubmittedAt
                lastUpdatedForDisplay
                stateCode
                state {
                    code
                    name
                    programs {
                        id
                        name
                        fullName
                        isRateProgram
                        isDeprecated
                        deprecatedByProgramId
                    }
                }
                stateNumber
                contractSubmissionType

                reviewStatusActions {
                    updatedAt
                    actionType
                }

                draftRevision {
                    ...strippedIlosRevisionFragment
                }

                latestSubmittedRevision {
                    ...strippedIlosRevisionFragment
                }
            }
        }
    }
}
